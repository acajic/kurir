<style>
/* Layout: paste bar across the top, drive list on the left, schematic Zagreb map filling the rest. */

  --paper: #111418; --panel: #181D23; --ink: #E5E8EB; --muted: #96A0AA; --line: #29313A; --soft: #1F252C;
  --land: #1A1F25; --water: #1C3446; --park: #1D2A20; --road: #3A434D; --casing: #262D35; --label: #8C949C;
  --accent: #6E9BFF; --accent-ink: #0B1220; --accent-soft: #1D2A47; --start: #F0B13A; --danger: #F07A6E; --ok: #7BC387;

:root[data-theme="dark"] {
  --paper: #111418; --panel: #181D23; --ink: #E5E8EB; --muted: #96A0AA; --line: #29313A; --soft: #1F252C;
  --land: #1A1F25; --water: #1C3446; --park: #1D2A20; --road: #3A434D; --casing: #262D35; --label: #8C949C;
  --accent: #6E9BFF; --accent-ink: #0B1220; --accent-soft: #1D2A47; --start: #F0B13A; --danger: #F07A6E; --ok: #7BC387;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; }
header.top { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 0.02em; display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.brand-mark svg { width: 16px; height: 16px; }
.brand small { font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: 0; }
.me { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.me strong { color: var(--ink); font-weight: 600; }
.linkbtn { background: none; border: 0; padding: 2px 4px; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

.paste { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
.paste-row { display: flex; gap: 8px; align-items: center; }
.paste-input { flex: 1; min-width: 0; height: 44px; border: 1.5px solid var(--line); border-radius: var(--r); padding: 0 14px; background: var(--paper); font-size: 15px; }
.paste-input:focus { border-color: var(--accent); outline: none; }
.paste-input::placeholder { color: var(--muted); }
.composer { margin-top: 12px; display: grid; gap: 12px; max-width: 980px; }
.notice { font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
.notice.warn { border-color: var(--start); }
.notice.err { border-color: var(--danger); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }

.when { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); }
.when-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.when-big { font-family: var(--font-mono); font-weight: 600; font-size: 20px; }

.tag { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tag.amber { background: transparent; color: var(--start); border: 1px solid var(--start); }

.scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.exact { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }

<script>
// ---- Google Maps directions link parsing ----
const ZAGREB_TZ = 'Europe/Zagreb';

function tzOffsetMs(utcMs, tz) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  }).formatToParts(new Date(utcMs));
  const p = {};
  for (const x of parts) p[x.type] = +x.value;
  return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - utcMs;
}

// Google encodes the chosen time as wall-clock seconds written as if UTC.
function zagrebWallToUtc(wallSecs) {
  const wall = wallSecs * 1000;
  let utc = wall - tzOffsetMs(wall, ZAGREB_TZ);
  utc = wall - tzOffsetMs(utc, ZAGREB_TZ);
  return utc;
}

// The data= blob is a flat list of !<id><type><value> tokens where an "m" token
// owns the next <value> tokens. Rebuild the tree from those counts.
function parseDataBlob(blob) {
  const toks = blob.split('!').filter(Boolean).map(t => {
    const m = /^(\d+)([a-z])(.*)$/.exec(t);
    return m ? { id: +m[1], type: m[2], value: m[3] } : null;
  }).filter(Boolean);
  let i = 0;
  function take(n) {
    const out = [];
    let used = 0;
    while (used < n && i < toks.length) {
      const t = toks[i++];
      used++;
      if (t.type === 'm') {
        const count = +t.value || 0;
        const start = i;
        t.children = take(count);
        used += i - start;
      }
      out.push(t);
    }
    return out;
  }
  return take(Infinity);
}

function findDirections(nodes) {
  for (const n of nodes) {
    if (n.type !== 'm' || !n.children) continue;
    const wps = n.children.filter(c => c.id === 1 && c.type === 'm');
    const hasMode = n.children.some(c => c.id === 3 && c.type === 'e');
    if (wps.length >= 2 || hasMode) return n;
    const deeper = findDirections(n.children);
    if (deeper) return deeper;
  }
  return null;
}

function waypointCoords(wp) {
  let lat = null, lng = null;
  (function walk(ns) {
    for (const c of ns) {
      if (c.type === 'd' && c.id === 1 && lng === null) lng = parseFloat(c.value);
      else if (c.type === 'd' && c.id === 2 && lat === null) lat = parseFloat(c.value);
      if (c.children) walk(c.children);
    }
  })(wp.children || []);
  return lat !== null && lng !== null && isFinite(lat) && isFinite(lng) ? [lat, lng] : null;
}

function cleanPlace(s) {
  return decodeURIComponent(s.replace(/\+/g, ' ')).replace(/\s+/g, ' ').trim();
}

function coordsFromText(s) {
  const m = /^\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/.exec(s || '');
  return m ? [+m[1], +m[2]] : null;
}

function isShortLink(u) {
  return /^(maps\.app\.goo\.gl|goo\.gl)$/i.test(u.hostname);
}

// Returns {ok, kind, places:[{name, ll}], time:{ms, type}|null, mode, link} or {ok:false, reason}
function parseMapsLink(raw) {
  const text = (raw || '').trim();
  const urlMatch = /https?:\/\/\S+/.exec(text);
  if (!urlMatch) return { ok: false, reason: 'empty' };
  let u;
  try { u = new URL(urlMatch[0]); } catch (e) { return { ok: false, reason: 'invalid' }; }
  const link = u.href;
  if (isShortLink(u)) return { ok: false, reason: 'short', link };
  if (!/(^|\.)google\.[a-z.]+$/i.test(u.hostname) || !/^\/maps/.test(u.pathname) && !/^maps\./.test(u.hostname)) {
    return { ok: false, reason: 'not-maps', link };
  }

  // ?api=1 style and the old saddr/daddr style
  const q = u.searchParams;
  if (q.get('destination') || q.get('daddr')) {
    const from = q.get('origin') || q.get('saddr') || '';
    const to = q.get('destination') || q.get('daddr') || '';
    const stops = (q.get('waypoints') || '').split('|').filter(Boolean);
    const places = [from, ...stops, to].map(s => ({ name: s.trim(), ll: coordsFromText(s) }));
    return { ok: true, places, time: null, mode: q.get('travelmode') || null, link };
  }

  const dirIdx = u.pathname.indexOf('/dir/');
  if (dirIdx < 0) return { ok: false, reason: 'not-directions', link };
  const rest = u.pathname.slice(dirIdx + 5).split('/');
  const segs = [];
  let blob = '';
  for (const s of rest) {
    if (s.startsWith('@')) continue;
    if (s.startsWith('data=')) { blob = s.slice(5); continue; }
    if (s.startsWith('am=')) continue;
    segs.push(s);
  }
  while (segs.length && segs[segs.length - 1] === '') segs.pop();
  const names = segs.map(cleanPlace);

  let wpNodes = [], time = null, mode = null;
  if (blob) {
    const dir = findDirections(parseDataBlob(blob));
    if (dir) {
      wpNodes = dir.children.filter(c => c.id === 1 && c.type === 'm');
      const opts = dir.children.find(c => c.id === 2 && c.type === 'm');
      if (opts && opts.children) {
        const j = opts.children.find(c => c.id === 8 && c.type === 'j');
        const e = opts.children.find(c => c.id === 6 && c.type === 'e');
        if (j && +j.value > 0) {
          time = { ms: zagrebWallToUtc(+j.value), type: e && e.value === '1' ? 'arrive' : 'depart' };
        }
      }
      const m = dir.children.find(c => c.id === 3 && c.type === 'e');
      if (m) mode = ['driving', 'bicycling', 'walking', 'transit'][+m.value] || null;
    }
  }

  const n = Math.max(names.length, wpNodes.length);
  if (n < 2) return { ok: false, reason: 'one-place', link };
  const places = [];
  for (let k = 0; k < n; k++) {
    const name = names[k] || '';
    const ll = (wpNodes[k] && waypointCoords(wpNodes[k])) || coordsFromText(name);
    places.push({ name, ll });
  }
  return { ok: true, places, time, mode, link };
}

if (typeof module !== 'undefined') module.exports = { parseMapsLink, zagrebWallToUtc };

</script>

    const r = b.dataset.range;
    state.search = ''; $('search').value = '';
    if (r === 'today') { state.anchorDay = state.day = startOfDay(Date.now()); state.rangeMode = 'day'; }
    else state.rangeMode = r;
    ensureWindow(); renderAll(true);
  });
  $('prev-week').addEventListener('click', () => { state.anchorDay = addDays(state.anchorDay, -7); state.day = addDays(state.day, -7); ensureWindow(); renderAll(true); });
  $('next-week').addEventListener('click', () => { state.anchorDay = addDays(state.anchorDay, 7); state.day = addDays(state.day, 7); ensureWindow(); renderAll(true); });
  $('search').addEventListener('input', e => { state.search = e.target.value; renderAll(true); });

  function canDelete(d) {
    if (state.uid && d.uid) return d.uid === state.uid;
    return !!state.name && d.name === state.name;
  }

  function renderList() {
    const ds = visibleDrives();
    const el = $('list');
    if (!ds.length) {
      let msg;
      if (state.db && !state.dbReady) msg = '<strong>Loading drives…</strong>';
      else if (state.search) msg = '<strong>No drives match “' + esc(state.search) + '”</strong><span>Search covers drives a month either side of the days shown.</span>';
      else if (state.rangeMode === 'week') msg = '<strong>No drives these days</strong><span>Paste a Google Maps directions link above to share yours.</span>';
      else msg = '<strong>No drives ' + (state.day === startOfDay(Date.now()) ? 'today yet' : 'on ' + esc(fmtDay(state.day))) + '</strong><span>Paste a Google Maps directions link above to share where you\'re driving. Use the days above to look at earlier or later drives.</span>';
      el.innerHTML = '<div class="empty">' + msg + '</div>';
      return;
    }
    const multiDay = state.search || state.rangeMode === 'week';
    const now = Date.now();
    let html = '', lastDay = null;
    ds.forEach(d => {
      const day = startOfDay(d.whenMs);
      if (multiDay && day !== lastDay) { html += '<div class="group-h">' + esc(fmtDayLong(d.whenMs)) + '</div>'; lastDay = day; }
      const sel = d.id === state.selectedId;
      const past = d.whenMs < now - 30 * 60000;
      html += '<div class="drive' + (sel ? ' sel' : '') + (past ? ' past' : '') + '" data-id="' + esc(d.id) + '" tabindex="0" role="button" aria-expanded="' + sel + '">' +
        '<div class="t">' + fmtTime(d.whenMs) + '<small>' + (d.timeType === 'arrive' ? 'arrive by' : 'depart') + '</small></div>' +
        '<div class="route">' +
          '<div class="leg"><span class="dot"></span><span>' + esc(sel ? d.from : shortPlace(d.from)) + '</span></div>' +
          '<div class="leg"><span class="dot end"></span><span>' + esc(sel ? d.to : shortPlace(d.to)) + '</span></div>' +
          '<div class="by"><span>by <strong>' + esc(d.name || 'Someone') + '</strong></span>' + (!d.fromLL || !d.toLL ? '<span>· not on map</span>' : '') + '</div>' +
          (d.comment && !sel ? '<div class="comment">' + esc(d.comment.length > 120 ? d.comment.slice(0, 118) + '…' : d.comment) + '</div>' : '') +
        '</div>' + (sel ? detailHtml(d) : '') + '</div>';
    });
    el.innerHTML = html;
    const selEl = el.querySelector('.drive.sel');
    if (selEl && renderList._scroll) { selEl.scrollIntoView({ block: 'nearest' }); renderList._scroll = false; }
  }
  function detailHtml(d) {
    const link = /^https:\/\/(www\.)?(google\.[a-z.]+\/maps|maps\.google\.[a-z.]+|maps\.app\.goo\.gl|goo\.gl)/i.test(d.link || '') ? d.link : null;
    let h = '<div class="detail">';
    if (d.stops && d.stops.length) h += '<div class="hint">Via ' + esc(d.stops.join(' → ')) + '</div>';
    h += '<div class="hint">' + esc(fmtDayLong(d.whenMs)) + ' · ' + (d.timeType === 'arrive' ? 'arriving by ' : 'leaving at ') + fmtTime(d.whenMs) +
      (d.timeSource === 'picked' ? ' (set by ' + esc(d.name || 'the driver') + ')' : '') + '</div>';
    if (d.distanceM) h += '<div class="hint">' + (d.distanceM / 1000).toFixed(1) + ' km · about ' + Math.max(1, Math.round(d.durationS / 60)) + ' min without traffic</div>';
    if (d.comment) h += '<div class="comment">' + esc(d.comment) + '</div>';
    h += '<div class="acts">' + (link ? '<a class="open" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">Open route in Google Maps</a>' : '');
    if (canDelete(d)) {
      h += state.confirmDelete === d.id
        ? '<span class="hint">Delete this drive?</span><button type="button" class="small-btn danger" data-act="del-yes">Delete</button><button type="button" class="small-btn" data-act="del-no">Keep</button>'
        : '<button type="button" class="small-btn" data-act="del">Delete</button>';
    }
    h += '</div>';
    return h + '</div>';
  }
  function select(id, fromMap) {
    if (state.selectedId === id && !fromMap) { state.selectedId = null; state.confirmDelete = null; subscribeReplies(); renderAll(false); return; }
    state.selectedId = id; state.confirmDelete = null;
    subscribeReplies();
    renderList._scroll = true;
    renderAll(false);
    const d = state.drives.find(x => x.id === id);
    if (d && d.fromLL && d.toLL) map.flyToBounds(L.latLngBounds([d.fromLL, d.toLL]).pad(0.35), { duration: 0.6, maxZoom: 15 });
  }
  $('list').addEventListener('click', async e => {
    const act = e.target.closest('[data-act]');
    if (act) {
      const d = state.drives.find(x => x.id === state.selectedId);
      if (!d) return;
      if (act.dataset.act === 'del') { state.confirmDelete = d.id; renderList(); }
      else if (act.dataset.act === 'del-no') { state.confirmDelete = null; renderList(); }
      else if (act.dataset.act === 'del-yes') {
        try {
          if (state.db && !d.id.startsWith('local-')) await state.db.collection('drives').doc(d.id).delete();
          else state.drives = state.drives.filter(x => x.id !== d.id);
          state.selectedId = null; state.confirmDelete = null; subscribeReplies(); renderAll(false); toast('Drive deleted');
        } catch (err) { toast('Couldn\'t delete the drive.'); }
      }
      return;
    }
    if (e.target.closest('.detail')) return;
    const row = e.target.closest('.drive');
    if (row) select(row.dataset.id, false);
  });
  $('list').addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('drive')) { e.preventDefault(); select(e.target.dataset.id, false); }
  });
  $('list').addEventListener('submit', async e => {
    const f = e.target.closest('[data-reply]'); if (!f) return;
    e.preventDefault();
    if (!state.name) return showGate();
    const input = f.querySelector('input');
    const text = input.value.trim(); if (!text) return;
    input.disabled = true;
    try {
      await state.db.collection('replies').add({ driveId: f.dataset.reply, name: state.name, uid: state.uid || null, text: text.slice(0, 300), createdMs: Date.now() });
      input.value = '';
    } catch (err) { toast(err && err.code === 'invalid_argument' ? 'You can\'t post messages with view-only access.' : 'Couldn\'t send the message.'); }
    input.disabled = false;
    const again = $('reply-' + f.dataset.reply); if (again) again.focus();
  });

  function renderAll() {
    renderDays();
    renderList();
    renderMapDrives();
  }

  // ---------- boot ----------
  renderMe();
  if (!state.name) showGate();
  renderAll();
  setInterval(() => { if (!state.draft) renderList(); }, 60000);

  if (window.claude && claude.use) {
    claude.use('user').then(async user => {
      if (!user) return;
      try { state.uid = await user.id(); } catch (e) {}
      try { const w = await user.can('data.write'); if (w === false) { state.writable = false; renderComposer(); } } catch (e) {}
      renderList();
    });
    claude.use('db').then(db => {
      if (!db) { state.dbReady = true; renderAll(); toast('Drives can\'t be loaded in this view.'); return; }
      state.db = db;
      ensureWindow();
    });
  } else {
    state.dbReady = true;
    renderAll();
  }
})();

</script>
